[package]
name = "transition-operator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "transition_operator"

[[bin]]
name = "transition-operator"
path = "src/bin/transition-operator.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[workspace]

[profile.test]
opt-level = 2
